name: Build and Push Client

on:
  push:
    branches:
      - main
    paths:
      - 'dockerfile'
      - '.dockerignore'
      - 'package*.json'
      - 'next.config.mjs'
      - 'postcss.config.mjs'
      - 'tailwind.config.ts'
      - 'tsconfig.json'
      - 'src/**'
      - 'public/**'
      - 'messages/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 9itchi-client

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test

  build:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase owner
        id: owner
        run: |
          echo "owner_lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # NEXT_PUBLIC_* are baked into the bundle. Set the repository variable NEXTAUTH_URL (public site URL,
      # e.g. https://9itchi.example.com); NEXT_PUBLIC_ABLY_KEY is an optional repository variable.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_USE_PROXY=true
            NEXT_PUBLIC_ACCOUNT_API_BASE_URL=${{ vars.NEXTAUTH_URL }}/api/account
            NEXT_PUBLIC_ABLY_KEY=${{ vars.NEXT_PUBLIC_ABLY_KEY }}
            NEXTAUTH_URL=${{ vars.NEXTAUTH_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner_lower }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner_lower }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger deployment workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: '${{ github.repository_owner }}',
              repo: '9itchi-deployment',
              event_type: 'service-built',
              client_payload: {
                service: 'client',
                version: '${{ github.sha }}',
                image_url: '${{ env.REGISTRY }}/${{ steps.owner.outputs.owner_lower }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
              }
            })
